<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品集后台编辑</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#f4efe7}*{box-sizing:border-box}body{margin:0;padding:32px;background:#111310}.wrap{max-width:920px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.top h1{margin:0;font-size:36px;letter-spacing:-.06em}.year-settings{margin-bottom:28px;padding:18px;border:1px solid #333;background:#171a16}.year-settings h2{margin:0 0 14px;font-size:16px}.year-settings-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.resume-settings{margin-bottom:28px;padding:18px;border:1px solid #333;background:#171a16}.resume-settings h2{margin:0 0 14px;font-size:16px}.resume-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resume-field.full{grid-column:1/-1}.resume-field label{display:block;color:#999;font-size:11px;margin-bottom:6px}.resume-field input,.resume-field textarea{width:100%;border:1px solid #3a3d36;background:#1c201b;color:#f4efe7;padding:10px 11px;border-radius:5px;font:14px inherit}.resume-field textarea{min-height:86px;resize:vertical}.year-setting label{display:block;color:#999;font-size:11px;margin-bottom:6px}.year-setting input{width:100%;border:1px solid #3a3d36;background:#1c201b;color:#f4efe7;padding:10px 11px;border-radius:5px;font:14px inherit}.top p{margin:6px 0 0;color:#aaa;font-size:13px}.back{color:#d9ff65;text-decoration:none;font-size:13px}.row{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start;padding:16px 0;border-top:1px solid #333}.preview{width:130px;height:96px;border:1px solid #3a3d36;background:#1c201b;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:contain;display:block}.resume-preview{height:100%;display:grid;place-items:center;color:#d9ff65;font-size:12px}.year{color:#d9ff65;font:12px monospace;padding-top:10px}.year small{color:#999}.field label{display:block;color:#999;font-size:11px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #3a3d36;background:#1c201b;color:#f4efe7;padding:10px 11px;border-radius:5px;font:14px inherit}.field textarea{min-height:68px;resize:vertical}.actions{position:sticky;bottom:20px;display:flex;justify-content:flex-end;gap:10px;padding-top:24px}.actions button{border:1px solid #d9ff65;background:#d9ff65;color:#12140f;border-radius:5px;padding:11px 18px;cursor:pointer}.actions button.secondary{background:#1c201b;color:#f4efe7;border-color:#555}.status{color:#d9ff65;font-size:12px;align-self:center}@media(max-width:700px){body{padding:20px}.row{grid-template-columns:90px 1fr}.preview{width:90px;height:72px}.row .desc{grid-column:2}.top h1{font-size:28px}.year-settings-grid{grid-template-columns:repeat(2,1fr)}.resume-grid{grid-template-columns:1fr}.resume-field.full{grid-column:auto}}
</style></head>
<body><main class="wrap"><header class="top"><div><h1>作品集后台编辑</h1><p>修改作品后保存，会生成独立的 portfolio-config.json 配置文件，可直接上传到 GitHub。</p></div><a class="back" href="/">返回作品集</a></header><section class="resume-settings"><h2>最后简历内容</h2><div class="resume-grid" id="resume-settings"></div></section><section id="editor"></section><div class="actions"><span class="status" id="status"></span><button class="secondary" id="reset">恢复默认</button><button class="secondary" id="export">导出配置文件</button><button id="save">保存并导出</button></div></main>
<script type="module">
const groups=[
  ['2023','spine-cartoonWord','Spine 卡通单词',3,'mp4','2021'],
  ['2023','spine-planet','Spine 星球',7,'mp4','2021'],
  ['2023','spine-slots','Spine 插槽动画',6,'mp4','2021'],
  ['2023','wordGame','单词游戏',4,'mp4','2021'],
  ['2023','wordGameCartoon','单词游戏角色',8,'mp4','2021'],
  ['2025','match3-buff','三消增益',19,'gif'],
  ['2025','match3-heroSkill','三消英雄技能',14,'mp4'],
  ['2026','wordGame','单词游戏',10,'mp4'],
];
const projects=[];
for (const [year,id,name,count,type,sourceYear] of groups) {
  for (let localSequence=1; localSequence<=count; localSequence++) {
    projects.push({year,id,name,localSequence,type,file:`${sourceYear || year}-${id}-${localSequence}.${type}`});
  }
}
projects.push({year:'2027',id:'resume',name:'我的简历',localSequence:1,type:'resume',file:null,resume:true});
const totals=projects.reduce((map,project)=>((map[project.year]=(map[project.year]||0)+1),map),{});
const sequences={};
projects.forEach(project=>{
  sequences[project.year]=(sequences[project.year]||0)+1;
  project.sequence=sequences[project.year];
  project.total=totals[project.year];
});
const key=project=>`${project.year}-${project.id}-${project.sequence}`;
const escapeHtml=value=>String(value??'').replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
const resumeSettings=document.querySelector('#resume-settings');
const resumeDefaults={name:'冀晓禹',role:'游戏特效师 / UI 动画与特效设计',contact:'18513418090　709168163@qq.com',education:'石家庄科技工程职业学院｜动漫设计与制作（大专）\n火星时代 118 期｜游戏特效',experience:'2014.09 — 至今\n游戏特效、UI 动画与特效制作、Spine 动画特效、Unity Animator、资源优化与项目协作。\n\n北京贝塔科技股份有限公司\n负责 UI 动画与特效制作、项目动画支援、资源优化和程序对接。',skills:'PS、AE、Spine、Unity、UE\n熟悉 UI 动画、UI 特效、休闲游戏视觉表现和程序协作。',summary:'工作积极认真，细心负责，善于分析问题、解决问题和与程序沟通。长期参与休闲游戏项目，主要方向是 2D UI 动画、UI 特效与 Spine 动画。'};
const assetUrl=path=>new URL(`../${path}`,import.meta.url).href;
let fileConfig={}; try { const response=await fetch(new URL('../portfolio-config.json',import.meta.url),{cache:'no-store'}); if(response.ok) fileConfig=await response.json(); } catch {}
let resumeCopy={...(fileConfig.resume||{})}; try { resumeCopy={...resumeCopy,...(JSON.parse(localStorage.getItem('portfolio-resume-copy')||'{}')||{})}; } catch {}
const resumeFields=[['name','姓名','input'],['role','求职方向','input'],['contact','联系方式','input'],['education','教育背景','textarea'],['experience','工作经验','textarea'],['skills','技能特长','textarea'],['summary','自我评价','textarea']];
resumeFields.forEach(([id,label,type])=>{ const field=document.createElement('div'); field.className=`resume-field ${['education','experience','skills','summary'].includes(id)?'full':''}`; field.innerHTML=`<label for="resume-${id}">${label}</label><${type} id="resume-${id}" class="resume-copy" data-resume="${id}">${type==='textarea'?escapeHtml(resumeCopy[id]??resumeDefaults[id]):''}</${type}>`; if(type==='input') field.querySelector('input').value=resumeCopy[id]??resumeDefaults[id]; resumeSettings.appendChild(field); });
let stored={...(fileConfig.projects||{})};
try { stored={...stored,...(JSON.parse(localStorage.getItem('portfolio-copy')||'{}')||{})}; } catch {}
const editor=document.querySelector('#editor');
projects.forEach(project=>{
  const copy=stored[key(project)]||{};
  const row=document.createElement('div');
  row.className='row';
  row.dataset.key=key(project);
  const preview=project.resume
    ? '<div class="resume-preview">简历</div>'
    : project.type==='gif'
      ? `<img src="${assetUrl(`myWorks/${project.file}`)}" alt="${escapeHtml(project.name)} ${project.sequence}">`
      : `<video src="${assetUrl(`myWorks/${project.file}`)}" muted loop autoplay playsinline></video>`;
  const defaultTitle=`${project.name} ${String(project.sequence).padStart(2,'0')}`;
  row.innerHTML=`<div class="preview">${preview}</div><div class="field"><label>作品标题</label><input class="title" value="${escapeHtml(copy.title||defaultTitle)}"><label>卡片文案</label><textarea class="description" placeholder="这张具体作品的说明">${escapeHtml(copy.description||'')}</textarea></div>`;
  editor.appendChild(row);
});
function buildConfig() {
  const projectsData={};
  document.querySelectorAll('.row').forEach(row=>{
    projectsData[row.dataset.key]={title:row.querySelector('.title').value.trim(),description:row.querySelector('.description').value.trim()};
  });
  const resumeData={}; document.querySelectorAll('.resume-copy').forEach(field=>{ resumeData[field.dataset.resume]=field.value.trim(); });
  return { projects: projectsData, resume: resumeData };
}
function downloadConfig() {
  const blob=new Blob([JSON.stringify(buildConfig(),null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a');
  link.href=url; link.download='portfolio-config.json'; link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  document.querySelector('#status').textContent='已生成 portfolio-config.json，请上传到项目根目录';
}
document.querySelector('#export').onclick=downloadConfig;
document.querySelector('#save').onclick=()=>{
  const config=buildConfig();
  localStorage.setItem('portfolio-copy',JSON.stringify(config.projects));
  localStorage.setItem('portfolio-resume-copy',JSON.stringify(config.resume));
  downloadConfig();
};
document.querySelector('#reset').onclick=()=>{localStorage.removeItem('portfolio-copy');localStorage.removeItem('portfolio-resume-copy');location.reload()};
</script></body></html>
