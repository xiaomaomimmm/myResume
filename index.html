    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#f4efe7; --muted:#a7a39d; --line:rgba(244,239,231,.18); --accent:#d9ff65; }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100%; background:#111310; color:var(--ink); font-family:Manrope,system-ui,sans-serif; }

      .showcase-card:nth-child(3) { right:7%; top:18%; transform:rotate(7deg); }
      .showcase-card:nth-child(4) { right:19%; top:8%; transform:rotate(-5deg); }
      .showcase-card:nth-child(5) { right:4%; bottom:18%; transform:rotate(-6deg); }

      .showcase-card .showcase-label { padding:7px 2px 0; color:var(--ink); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      .ring-gallery.visible { opacity:1; pointer-events:auto; }

      .ring-core { position:relative; z-index:2; display:grid; place-items:center; width:clamp(110px,16vw,190px); height:clamp(110px,16vw,190px); border:1px solid color-mix(in srgb, var(--accent) 75%, transparent); border-radius:50%; background:rgba(17,19,16,.18); box-shadow:0 0 40px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 0 32px color-mix(in srgb, var(--accent) 12%, transparent); pointer-events:none; }
      .ring-year { color:var(--accent); font:800 clamp(26px,4vw,54px) 'DM Mono',monospace; letter-spacing:-.08em; }
      .ring-hint { position:absolute; top:calc(100% + 10px); color:var(--muted); font-size:10px; white-space:nowrap; }
      .ring-items { position:absolute; inset:0; overflow:visible; perspective:1200px; }
      .ring-card { position:absolute; left:50%; top:50%; width:clamp(86px,10vw,132px); aspect-ratio:var(--card-ratio, 1 / 1.12); border:0; border-radius:15px; background:transparent; box-shadow:none; transform-origin:center; cursor:grab; will-change:transform, opacity; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; -webkit-touch-callout:none; touch-action:none; contain:layout style; }
      .ring-card:active { cursor:grabbing; }
      .ring-card:hover .ring-media { box-shadow:0 16px 34px rgba(0,0,0,.42); }
      .ring-card.is-front .ring-media { box-shadow:0 16px 30px rgba(0,0,0,.36); }
      .ring-card .ring-media { position:relative; width:100%; height:100%; overflow:hidden; border-radius:15px; background:#242820; box-shadow:0 12px 26px rgba(0,0,0,.25); }
      .ring-clip { display:none; position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; border-radius:15px; }
      .ring-card.is-front .ring-clip { display:block; }
      .ring-card.is-front .ring-still { display:none; }
      .ring-card img,.ring-card video { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; -webkit-user-drag:none; user-select:none; }
      .ring-card .ring-name { position:absolute; top:-18px; left:0; max-width:100%; color:#fff; font-size:10px; line-height:1.15; text-shadow:0 1px 5px rgba(0,0,0,.9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .side-card,.panel { display:none !important; }
      .showcase-deck { display:none !important; }
      .ring-loading { position:absolute; inset:0; z-index:2; display:grid; place-items:center; background:rgba(12,14,11,.34); opacity:0; pointer-events:none; transition:opacity .18s ease; }
      .ring-loading.visible { opacity:1; }
      .ring-loading::after { content:''; width:22px; height:22px; border:2px solid rgba(244,239,231,.28); border-top-color:var(--accent); border-radius:50%; animation:loading-spin .8s linear infinite; box-shadow:0 0 14px color-mix(in srgb, var(--accent) 35%, transparent); }
      @keyframes loading-spin { to { transform:rotate(360deg); } }
      .focus-layer { position:fixed; inset:0; z-index:1000; isolation:isolate; display:grid; place-items:center; padding:32px; background:rgba(5,7,5,.78); backdrop-filter:blur(18px); opacity:0; pointer-events:none; transition:opacity .28s ease; }
      .focus-layer.visible { opacity:1; pointer-events:auto; }
      .focus-card { position:relative; z-index:1; width:min(50vw,700px); height:min(94vh,1000px); max-height:calc(100vh - 64px); display:flex; flex-direction:column; padding:18px; border:1px solid rgba(244,239,231,.28); background:rgba(17,19,16,.96); box-shadow:0 24px 80px rgba(0,0,0,.42); transform:translateY(18px) scale(.96); transition:transform .34s cubic-bezier(.2,.8,.2,1); }
      .focus-layer.visible .focus-card { transform:translateY(0) scale(1); }
      .focus-close { position:absolute; top:-17px; right:-17px; z-index:2; width:34px; height:34px; border:1px solid var(--line); border-radius:50%; background:rgba(17,19,16,.72); color:var(--ink); cursor:pointer; font-size:20px; line-height:1; }
      .focus-nav { position:absolute; top:50%; z-index:3; width:42px; height:64px; display:grid; place-items:center; padding:0 0 8px; border:1px solid rgba(244,239,231,.28); border-radius:12px; background:rgba(17,19,16,.62); color:var(--ink); cursor:pointer; font:34px/1 Arial,sans-serif; transform:translateY(-50%); transition:background .2s ease, transform .2s ease; }
      .focus-nav:hover { background:rgba(17,19,16,.9); }
      .focus-nav:active { transform:translateY(-50%) scale(.94); }
      .focus-layer.resume-focus .focus-nav { display:none !important; }
      .focus-prev { left:-58px; }
      .focus-next { right:-58px; }
      .focus-media { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#242820; border:1px solid rgba(255,255,255,.12); }
      .focus-media video,.focus-media img { width:100%; height:100%; object-fit:contain; display:block; background:rgba(0,0,0,.2); }
      .focus-meta { display:flex; justify-content:space-between; gap:20px; margin-top:14px; }
      .focus-tag { display:none; color:var(--accent); font:11px 'DM Mono',monospace; white-space:pre-line; line-height:1.5; }
      .focus-title { margin:6px 0 0; font-size:24px; letter-spacing:-.05em; }
      .focus-description { margin:6px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }
      .focus-counter { color:var(--muted); font:11px 'DM Mono',monospace; white-space:nowrap; }
      body.focus-open { overflow:hidden; }
      .panel { position:absolute; left:50%; top:50%; width:min(50vw, 680px); height:calc(100vh - 40px); max-height:calc(100vh - 40px); padding:14px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--line); background:rgba(17,19,16,.9); backdrop-filter:blur(10px); opacity:0; transform:translate(-50%,-50%) translateY(-120vh) rotate(-4deg); transition:opacity .25s ease; z-index:3; }
      .panel.drop { animation:drop-in .72s cubic-bezier(.16,.84,.28,1) both; }
      @keyframes drop-in { 0% { opacity:0; transform:translate(-50%,-50%) translateY(-120vh) rotate(-8deg); } 66% { opacity:1; transform:translate(-50%,-50%) translateY(18px) rotate(2deg); } 84% { transform:translate(-50%,-50%) translateY(-8px) rotate(-1deg); } 100% { opacity:1; transform:translate(-50%,-50%) translateY(0) rotate(0); } }
      .side-card { position:absolute; top:50%; width:min(210px,18vw); padding:10px; border:1px solid var(--line); background:rgba(17,19,16,.58); opacity:.34; transform:translateY(-50%) translateX(var(--shift, 0px)) scale(var(--scale, .72)); transition:opacity .75s ease, filter .75s ease; z-index:2; pointer-events:auto; cursor:zoom-in; filter:brightness(.55) saturate(.55); }
      .side-card.left { left:5%; } .side-card.right { right:5%; }
      .side-card.visible { opacity:.62; }
      .side-card:not(.visible) { opacity:0; }
      .side-card.side-enter-left { animation:side-enter-left .62s linear both; }
      .side-card.side-enter-right { animation:side-enter-right .62s linear both; }
      @keyframes side-enter-left { from { opacity:0; transform:translateY(-50%) translateX(-28vw) scale(.78); } to { opacity:.62; transform:translateY(-50%) translateX(0) scale(.78); } }
      @keyframes side-enter-right { from { opacity:0; transform:translateY(-50%) translateX(28vw) scale(.78); } to { opacity:.62; transform:translateY(-50%) translateX(0) scale(.78); } }
      .panel.slide-next { animation:slide-next .72s cubic-bezier(.4,0,.2,1) both; }
      .panel.slide-prev { animation:slide-prev .72s cubic-bezier(.4,0,.2,1) both; }
      @keyframes slide-next { from { opacity:.4; transform:translate(-50%,-50%) translateX(28vw) scale(.64); } to { opacity:1; transform:translate(-50%,-50%) translateX(0) scale(1); } }
      @keyframes slide-prev { from { opacity:.4; transform:translate(-50%,-50%) translateX(-28vw) scale(.64); } to { opacity:1; transform:translate(-50%,-50%) translateX(0) scale(1); } }
      .side-card .side-media { aspect-ratio:1; overflow:hidden; background:#242820; margin-bottom:8px; }
      .side-card:nth-child(2), .side-card:nth-child(5) { z-index:1; }
      .side-card img,.side-card video,.side-card canvas { width:100%; height:100%; object-fit:cover; display:block; }
      .side-title { font-size:13px; letter-spacing:-.03em; }
      .side-meta { margin-top:4px; color:var(--muted); font:10px 'DM Mono',monospace; }
      .panel.visible { opacity:1; }
      .panel.fly-away { animation:fly-away .62s cubic-bezier(.7,0,.9,.35) both; }
      .side-card.fly-away { opacity:0; transform:translateY(-135vh) translateX(var(--shift, 0px)) scale(.55); filter:brightness(.5); transition:transform .62s cubic-bezier(.7,0,.9,.35), opacity .45s ease; }
      @keyframes fly-away { from { opacity:1; transform:translate(-50%,-50%) translateY(0) scale(1); } to { opacity:0; transform:translate(-50%,-50%) translateY(-135vh) scale(.72); } }
      .media-frame { flex:1 1 auto; min-height:0; aspect-ratio:auto; background:#242820; overflow:hidden; margin:0 0 14px; border:1px solid rgba(255,255,255,.12); }
      .media-frame video, .media-frame img { width:100%; height:100%; object-fit:contain; display:block; background:rgba(0,0,0,.18); }
      .panel-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
      .counter { color:var(--muted); font:11px 'DM Mono',monospace; }
      .panel .tag { color:var(--accent); font:11px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.1em; white-space:pre-line; line-height:1.55; }
      .panel h2 { margin:7px 0 6px; font-size:22px; letter-spacing:-.05em; }
      .panel p { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.55; }
      .panel.resume-panel .media-frame { aspect-ratio:auto; min-height:260px; display:flex; align-items:center; }
      .resume-content { width:100%; height:100%; min-height:0; padding:26px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
      .resume-head { display:flex; justify-content:space-between; gap:24px; padding-bottom:18px; border-bottom:1px solid var(--line); }
      .resume-role { margin:4px 0 0; color:var(--muted); }
      .resume-contact { color:var(--muted); font:11px 'DM Mono',monospace; line-height:1.6; text-align:right; }
      .resume-grid { display:grid; grid-template-columns:1fr; gap:26px; padding-top:22px; }
      .resume-grid h4 { margin:0 0 8px; color:var(--accent); font-size:12px; letter-spacing:.04em; }
      .resume-grid p { margin:0; color:var(--ink); white-space:normal; }
      .focus-layer.resume-focus .focus-card { width:min(50vw,700px); height:calc(100vh - 28px); max-height:none; }
      .focus-layer.resume-focus .focus-meta { display:none; }
      .resume-content h3 { margin:0 0 18px; color:var(--accent); font-size:32px; }
      .resume-content p { margin:8px 0; color:var(--ink); }
      .panel .media-frame video, .panel .media-frame img { object-fit:contain; background:rgba(0,0,0,.18); }

      .mobile-controls { display:grid; grid-template-columns:repeat(2, 44px); gap:5px; position:absolute; left:32px; bottom:28px; z-index:12; pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none; }
      .mobile-controls button { width:44px; height:44px; border:1px solid rgba(244,239,231,.34); background:rgba(17,19,16,.38); color:var(--ink); border-radius:6px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-size:18px; cursor:pointer; transition:background .2s ease, transform .2s ease; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; } .mobile-controls button:active { background:rgba(244,239,231,.22); transform:scale(.94); }
      @media (max-width:900px) { .panel { width:50vw; } .side-card { width:22vw; } .side-card.left { left:1.5%; } .side-card.right { right:1.5%; } }
      @media (max-width:760px) { .topbar { left:16px; right:16px; top:16px; } .brand { right:0; font-size:16px; } .meta { right:16px; bottom:16px; font-size:10px; } .panel { width:50vw; top:50%; } .side-card { width:28vw; padding:6px; } .side-card.left { left:-4%; } .side-card.right { right:-4%; } .side-title { font-size:10px; } .side-meta { font-size:8px; } .media-frame { aspect-ratio:1; } .mobile-controls { left:16px; bottom:16px; } }
      @media (max-width:760px) { .resume-grid { grid-template-columns:1fr; } .resume-head { flex-direction:column; } .resume-contact { text-align:left; } }
      @media (orientation:portrait) and (max-width:560px) { .panel { top:50%; } .side-card { width:25vw; opacity:.45; } .side-card.left { left:-7%; } .side-card.right { right:-7%; } .showcase-card { width:26vw; } .ring-card { width:clamp(68px,19vw,100px); border-radius:12px; } .ring-card .ring-media { border-radius:12px; } .ring-core { width:110px; height:110px; } .showcase-card:nth-child(1) { left:2%; top:18%; } .showcase-card:nth-child(2) { left:10%; top:8%; } .showcase-card:nth-child(3) { right:2%; top:17%; } .showcase-card:nth-child(4) { right:9%; top:7%; } .showcase-card:nth-child(5) { right:1%; bottom:18%; } .focus-layer { padding:14px; } .focus-card { width:94vw; height:92vh; padding:12px; } .focus-title { font-size:20px; } .focus-layer.resume-focus .focus-card { width:94vw; height:92vh; } .focus-close { top:-12px; right:-12px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="file-protocol-notice" id="file-protocol-notice">
      <div class="file-protocol-notice-inner">
        <h1>请通过本地预览打开作品集</h1>
        <p>直接双击 index.html 会被浏览器拦截模块和作品资源，所以页面无法显示。</p>
        <p>请双击项目里的 <code>本地预览.command</code>，它会自动启动并打开网页。</p>
      </div>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('file-protocol-notice').style.display = 'grid';
      }
    </script>
    <div class="hud">
      <div class="showcase-deck" id="showcase-deck" aria-label="作品卡片展示"></div><div class="ring-gallery" id="ring-gallery" aria-hidden="true"><div class="ring-items" id="ring-items"></div></div>
      <div class="topbar"><div class="brand">冀晓禹<span>•</span>作品集</div><div class="meta">版本 2026.11.24 o</div></div>
      
      
      <div class="side-card left" id="side-left"></div><div class="panel" id="project-panel"><div class="media-frame" id="media-frame"></div><div class="panel-top"><div class="tag" id="panel-tag">2021 / 作品</div><div class="counter" id="panel-counter">01 / 01</div></div><h2 id="panel-title">作品</h2><p id="panel-description"></p></div><div class="side-card right" id="side-right"></div><div class="focus-layer" id="focus-layer" aria-hidden="true"><div class="focus-card" role="dialog" aria-modal="true" aria-label="作品预览"><button class="focus-close" id="focus-close" aria-label="关闭作品预览">×</button><button class="focus-nav focus-prev" id="focus-prev" aria-label="上一个作品" hidden>‹</button><button class="focus-nav focus-next" id="focus-next" aria-label="下一个作品" hidden>›</button><div class="focus-media" id="focus-media"></div><div class="focus-meta"><div><div class="focus-tag" id="focus-tag"></div><h2 class="focus-title" id="focus-title"></h2><p class="focus-description" id="focus-description"></p></div><div class="focus-counter" id="focus-counter"></div></div></div></div>
      <div class="mobile-controls"><button data-key="ArrowUp" aria-label="向前">↑</button><button data-key="ArrowDown" aria-label="向后">↓</button></div>
    </div>
    <script type="module" src="./src/main.js?v=20261124o"></script>
  </body>
</html>
